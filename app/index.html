<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <script>
      // Mirrors useDarkMode so the static skeleton paints in the right theme before React mounts.
      try {
        if (
          localStorage.getItem("doesBetterDoPreferDarkMode") !== "false" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    </script>
    <!-- Tints the Android status bar to match the skeleton header; FullScreenLoader removes it once the app renders. -->
    <meta name="theme-color" content="#666666" id="skeleton-theme-color" />
    <link rel="stylesheet" type="text/css" href="/src/critical.css" id="critical-css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- media="print" keeps the font stylesheet from blocking first paint; it applies once loaded. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <link rel="manifest" href="https://betterdo.app/app/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://betterdo.app/icon-apple.png" />
    <link rel="icon" type="image/png" href="https://betterdo.app/favicon.ico" />
    <link rel="manifest" href="https://betterdo.app/site.webmanifest" />
    <link rel="mask-icon" href="https://betterdo.app/safari-pinned-tab.svg" color="#5bbad5" />
    <title>BetterDo.</title>
    <meta name="description" content="The better task manager" />
    <link rel="canonical" href="https://betterdo.app/app/" />
    <meta property="og:image:width" content="183" />
    <meta property="og:image:height" content="183" />
    <meta
      property="og:description"
      content="A todo application designed with you in mind. Featuring shared lists, personalization, and a slick user interface."
    />
    <meta property="og:title" content="BetterDo." />
    <meta property="og:url" content="https://betterdo.app/" />
    <meta property="og:image" content="https://betterdo.app/icon-512x512.png" />
    <meta name="twitter:creator" content="@branclon_" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <section class="app-skeleton" aria-busy="true" aria-label="Loading BetterDo">
      <div class="skeleton-logo">
        <div class="skeleton-logo-content">
          <h1>Better<span>Do.</span></h1>
        </div>
      </div>
      <div class="skeleton-header">
        <div class="skeleton-hamburger"><i></i><i></i><i></i></div>
        <div class="skeleton-bar skeleton-title"></div>
      </div>
      <div class="skeleton-nav">
        <div class="skeleton-nav-item">
          <i></i>
          <div class="skeleton-bar" style="width: 55%"></div>
        </div>
        <div class="skeleton-nav-item">
          <i></i>
          <div class="skeleton-bar" style="width: 40%"></div>
        </div>
        <div class="skeleton-nav-item">
          <i></i>
          <div class="skeleton-bar" style="width: 65%"></div>
        </div>
        <div class="skeleton-nav-item">
          <i></i>
          <div class="skeleton-bar" style="width: 45%"></div>
        </div>
        <div class="skeleton-nav-item">
          <i></i>
          <div class="skeleton-bar" style="width: 60%"></div>
        </div>
      </div>
      <div class="skeleton-body">
        <div class="skeleton-input"></div>
        <div class="skeleton-task">
          <i></i>
          <div class="skeleton-bar" style="width: 45%"></div>
        </div>
        <div class="skeleton-task">
          <i></i>
          <div class="skeleton-bar" style="width: 60%"></div>
        </div>
        <div class="skeleton-task">
          <i></i>
          <div class="skeleton-bar" style="width: 35%"></div>
        </div>
        <div class="skeleton-task">
          <i></i>
          <div class="skeleton-bar" style="width: 55%"></div>
        </div>
        <div class="skeleton-task">
          <i></i>
          <div class="skeleton-bar" style="width: 40%"></div>
        </div>
      </div>
    </section>
    <section class="main-container"></section>
  </body>

  <script type="module" src="./src/index.tsx"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-55983139-4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());
    gtag("config", "UA-55983139-4");
  </script>
</html>
